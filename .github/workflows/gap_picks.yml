name: NSE morning gap list (cloud fallback)

# All times IST (cron below is UTC = IST - 5:30).
#
# The laptop publishes the model-ranked list at 08:15 IST.  This workflow only
# stands in when it does not: `gap_reversal.py cloud-fallback` builds the list
# at 08:00, gives the laptop until 08:20, then publishes to main and pushes to
# the phone - by ~08:21 IST.  Since 2026-11-23 it ranks with the same promoted
# model as the laptop (the laptop syncs the model files to main); the ~430 days
# of NSE files the model's inputs need live in the Actions cache, topped up by
# the "Refresh the NSE archive" step while the 03:00 run waits.
#
# GitHub starts scheduled runs late (15 min is normal here, more under load) and
# can drop them, so the main run is scheduled at 03:00 IST and simply waits
# until 08:00; two later runs are back-ups in case it is dropped.  Only one run
# executes at a time (concurrency group); a run that finds today's list already
# on main stands aside.  Runner minutes are free for public repositories.

on:
  schedule:
    - cron: '30 21 * * 0-4'   # 03:00 IST Mon-Fri: main run, waits until 08:00 IST
    - cron: '17 2 * * 1-5'    # 07:47 IST Mon-Fri: back-up
    - cron: '37 2 * * 1-5'    # 08:07 IST Mon-Fri: back-up
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run: build now and print the list (publishes nothing). publish: real fallback run."
        type: choice
        options: [dry-run, publish]
        default: dry-run

concurrency:
  group: gap-picks
  cancel-in-progress: false

env:
  ARCHIVE: |
    data/nse_bhav
    data/nse_fo
    data/nse_extra
    data/nse_flows
    data/nse_bands
    data/nse_preopen
    data/nse_corp
    data/nse_holidays.json
    data/candles.sqlite3

jobs:
  morning_picks:
    runs-on: ubuntu-latest
    timeout-minutes: 345          # the 03:00 IST run ends by ~08:21 IST (5 h 21 min)
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            data/models/constraints.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          # The champion's pickles load only under the versions that saved them
          # (scikit-learn 1.9 cannot read a 1.8 model): install exactly those.
          if [ -f data/models/constraints.txt ]; then
            pip install -r requirements.txt -c data/models/constraints.txt
          else
            pip install -r requirements.txt
          fi

      - name: Restore the NSE archive
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ARCHIVE }}
          key: nse-archive-${{ github.run_id }}
          restore-keys: nse-archive-

      # The first run on an empty cache downloads ~430 days (10-30 min); later
      # runs fetch only the days since.  Done now, not at 08:00, so the list is
      # still out by 08:21.  A failure here only means the 08:00 build fetches more.
      - name: Refresh the NSE archive
        continue-on-error: true
        timeout-minutes: 90
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from nse_intraday_ai import pipeline as P
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          P.refresh(today - timedelta(days=1), days=430)
          PY

      # Never let the cache block the list: a failed save (nothing to save after a
      # failed refresh, a key clash on a re-run) must not skip the fallback below.
      - name: Save the NSE archive
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ARCHIVE }}
          key: nse-archive-${{ github.run_id }}

      - name: Cloud fallback (stands aside if the laptop publishes by 08:20 IST)
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional: phone push on days the laptop is off
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$MODE" != "publish" ]; then
            python scripts/gap_reversal.py cloud-fallback --dry-run --any-day --build-at 00:00 --deadline 00:00
          else
            python scripts/gap_reversal.py cloud-fallback --push
          fi
