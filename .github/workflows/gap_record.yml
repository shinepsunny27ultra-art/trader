name: NSE paper result (cloud)

# All times IST (cron is UTC = IST - 5:30).
#
# The laptop records the day's paper result at 15:40 IST.  On days it is off,
# this run books the list that went out that morning (laptop, evening or cloud
# fallback) from Yahoo's 5-minute bars, pushes the result to the phone and
# commits data/gap_reversal/paper_book.csv to main, so the Streamlit Cloud
# dashboard shows it.  It stands aside for any session main already has, and
# the laptop adopts the cloud's sessions instead of re-recording them.

on:
  schedule:
    - cron: '0 11 * * 1-5'     # 16:30 IST Mon-Fri
    - cron: '30 15 * * 1-5'    # 21:00 IST Mon-Fri: back-up
  workflow_dispatch:

concurrency:
  group: gap-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record the paper result (stands aside if main already has it)
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: python scripts/gap_reversal.py record --push
