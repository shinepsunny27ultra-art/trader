name: NSE gold stocks list (cloud)

# All times IST (cron is UTC = IST - 5:30).
#
# The gold book (src/nse_intraday_ai/gold_book.py): at most 3 gold-linked stocks a
# day.  09:00:30 - lender trades on gold's overnight move (entered in the pre-open);
# 09:16 - the slots left go to gap fades on today's opening prices.  The laptop runs
# the same jobs; whichever publishes a stage first wins, the other stands aside.
# GitHub starts scheduled runs late, so the run starts at 08:30 and waits.

on:
  schedule:
    - cron: '0 3 * * 1-5'      # 08:30 IST Mon-Fri
    - cron: '20 3 * * 1-5'     # 08:50 IST Mon-Fri: back-up
  workflow_dispatch:

concurrency:
  group: gold-book
  cancel-in-progress: false

env:
  ARCHIVE: |
    data/nse_bhav
    data/nse_fo
    data/nse_extra
    data/nse_flows
    data/nse_bands
    data/nse_preopen
    data/nse_corp
    data/nse_holidays.json
    data/candles.sqlite3

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            data/models/constraints.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          # The champion's pickles load only under the versions that saved them
          # (scikit-learn 1.9 cannot read a 1.8 model): install exactly those.
          if [ -f data/models/constraints.txt ]; then
            pip install -r requirements.txt -c data/models/constraints.txt
          else
            pip install -r requirements.txt
          fi

      # The morning gap workflow keeps ~430 days of NSE files here (refreshed ~03:30 IST).
      - name: Restore the NSE archive
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ARCHIVE }}
          key: nse-archive-${{ github.run_id }}
          restore-keys: nse-archive-

      - name: Pre-open list (lender trades), 09:00:30 IST
        run: |
          python - <<'PY'
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          wait = (now.replace(hour=9, minute=0, second=30, microsecond=0) - now).total_seconds()
          if wait > 0:
              print(f"waiting {wait / 60:.1f} min", flush=True)
              time.sleep(wait)
          PY
          python scripts/gold_book.py preopen --push

      - name: Final list (gap fades), 09:16 IST
        if: always()
        run: |
          python - <<'PY'
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          wait = (now.replace(hour=9, minute=16, second=0, microsecond=0) - now).total_seconds()
          if wait > 0:
              print(f"waiting {wait / 60:.1f} min", flush=True)
              time.sleep(wait)
          PY
          python scripts/gold_book.py open --push
